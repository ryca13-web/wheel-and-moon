<script>
'use strict';
const $=s=>document.querySelector(s),DAY=864e5,RAD=Math.PI/180;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mod=(a,n)=>((a%n)+n)%n,sd=x=>Math.sin(x*RAD),cd=x=>Math.cos(x*RAD);
const mdl=d=>d.toLocaleDateString([], {month:'short',day:'numeric'});
const wdl=d=>d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
const dayN=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/DAY);
const cdTxt=n=>n===0?'today':n===1?'tomorrow':n<0?Math.abs(n)+' days ago':'in '+n+' days';

/* ---------- SETTINGS (stored only in this browser; a link can carry them) ---------- */
const DEF={name:'',lat:null,lon:null,place:'',hemi:'auto',units:'F',h24:false,tarot:true,saver:5,cross:'trad',theme:'auto',dim:true,cycle:false,sunSec:60,moonSec:60};
const snap15=v=>Math.min(3600,Math.max(15,Math.round((parseFloat(v)||60)/15)*15));
let S=Object.assign({},DEF);
function loadS(){
 try{Object.assign(S,JSON.parse(localStorage.getItem('wm_s')||'{}'))}catch(e){}
 try{const q=new URLSearchParams(location.search);
  ['name','place','units','cross','theme','hemi'].forEach(k=>{if(q.has(k))S[k]=q.get(k)});
  if(q.has('lat')&&q.has('lon')){S.lat=parseFloat(q.get('lat'));S.lon=parseFloat(q.get('lon'))}
  if(q.has('cycle'))S.cycle=q.get('cycle')==='1';
  if(q.has('sun'))S.sunSec=snap15(q.get('sun'));if(q.has('moon'))S.moonSec=snap15(q.get('moon'));
  if(q.has('dim'))S.dim=q.get('dim')!=='0';
  if(q.has('h24'))S.h24=q.get('h24')==='1';
  if(q.has('tarot'))S.tarot=q.get('tarot')!=='0';
  if(q.has('saver'))S.saver=parseFloat(q.get('saver'))||0}catch(e){}
 if(!(S.lat>=-90&&S.lat<=90&&S.lon>=-180&&S.lon<=180)){S.lat=null;S.lon=null}}
function saveS(){try{localStorage.setItem('wm_s',JSON.stringify(S))}catch(e){}}
const hasLoc=()=>S.lat!=null&&S.lon!=null;
const isSouth=()=>S.hemi==='s'||(S.hemi==='auto'&&hasLoc()&&S.lat<0);

/* ---------- ASTRONOMY (all computed here; nothing is fetched) ---------- */
const jdOf=t=>t/DAY+2440587.5,tOf=j=>(j-2440587.5)*DAY,DELTA_T=70;
const EQM=[[2451623.80984,365242.37404,0.05169,-0.00411,-0.00057],[2451716.56767,365241.62603,0.00325,0.00888,-0.0003],[2451810.21715,365242.01767,-0.11575,0.00337,0.00078],[2451900.05952,365242.74049,-0.06223,-0.00823,0.00032]];
const EQA=[485,203,199,182,156,136,77,74,70,58,52,50,45,44,29,18,17,16,14,12,12,12,9,8];
const EQB=[324.96,337.23,342.08,27.85,73.14,171.52,222.54,296.72,243.58,119.81,297.17,21.02,247.54,325.15,60.93,155.12,288.79,198.04,199.76,95.39,287.11,320.81,227.73,15.45];
const EQC=[1934.136,32964.467,20.186,445267.112,45036.886,22518.443,65928.934,3034.906,9037.513,33718.147,150.678,2281.226,29929.562,31555.956,4443.417,67555.328,4562.452,62894.029,31436.921,14577.848,31931.756,34777.259,1222.114,16859.074];
const eqCache={};
/* k: 0 March equinox, 1 June solstice, 2 September equinox, 3 December solstice */
function season(Y,k){const key=Y+'.'+k;if(eqCache[key])return eqCache[key];
 const y=(Y-2000)/1000,m=EQM[k],j0=m[0]+m[1]*y+m[2]*y*y+m[3]*y*y*y+m[4]*y*y*y*y,T=(j0-2451545)/36525,W=35999.373*T-2.47,dl=1+0.0334*cd(W)+0.0007*cd(2*W);
 let s=0;for(let i=0;i<24;i++)s+=EQA[i]*cd(EQB[i]+EQC[i]*T);

 <div class="mbig">${moonSVG(m.f)}</div><p style="text-align:center">${PHASE_TXT[m.idx]}</p>
 <h3>Next phases</h3>${ev.map(e=>`<div class="row" style="cursor:default">${moonIcon([0,.25,.5,.75][e.type],22)}<div class="n">${NM[e.type]}${e.type===2&&fullName(e.t)?'<small>'+fullName(e.t)+' Moon</small>':''}</div><div class="d">${wdl(e.t)}<small>${tm(e.t)} · ${cdTxt(dayN(now,e.t))}</small></div></div>`).join('')}
 ${nfn?`<h3>${nfn} Moon</h3><p>${FM_MEAN[nfn]}</p>`:''}
 <h3>Eclipses ahead</h3>${ECL.filter(x=>x[0]>=ymd(now)).slice(0,5).map(x=>{const d=new Date(x[0]+'T12:00:00');return `<div class="row" style="cursor:default">${ic('eclipse',20)}<div class="n">${x[1]}</div><div class="d">${mdl(d)}<small>${d.getFullYear()}</small></div></div>`}).join('')||'<p class="hint">No eclipses listed.</p>'}
 <p class="hint">Eclipse dates (UT) come from NASA’s published lists; visibility depends on where you are.</p>
 <h3>Full moons in ${now.getFullYear()}</h3>${fi.map(f=>{const nm=fullName(f);return `<div class="row" style="cursor:default">${moonIcon(.5,20)}<div class="n">${nm?nm+' Moon':'Full Moon'}</div><div class="d">${mdl(f)}</div></div>`}).join('')}
 <p class="hint">Names are traditional northern-hemisphere folk names.</p>
 <h3>The eight phases</h3>${PH_N.map((n,i)=>`<div class="row" style="cursor:default${i===m.idx?';color:var(--gold)':''}">${moonIcon(i/8,22)}<div class="n">${n}<small>${PHASE_TXT[i]}</small></div></div>`).join('')}
 ${isSouth()?'<p class="hint">In the southern hemisphere the lit side is shown on the opposite side, as you see it.</p>':''}`)}
function sheetDay(k){const d=new Date(k+'T12:00:00'),m=moonAt(d),now=new Date(),mk=calMarks(d.getFullYear(),d.getMonth())[k]||[],sab=slotsOf(d.getFullYear()).find(e=>ymd(e.t)===k),st=hasLoc()?sunTimes(d,S.lat,S.lon):null,ec=ECL.find(x=>x[0]===k);
 const full=mk.indexOf('fm')>=0?fullName(d):'',c=tarotToday(d);
 openSheet(`<h2>${d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><p class="sub">${cdTxt(dayN(now,d))}</p>
 ${sab?`<div class="row" data-a="sab:${sab.idx}">${ic('wheel')}<div class="n">${WN[sab.idx]}<small>${W8[sab.idx].blurb}</small></div></div>`:''}
 ${mk.indexOf('fm')>=0?`<div class="row" data-a="moon">${moonIcon(.5,22)}<div class="n">${full?full+' Moon':'Full Moon'}</div></div>`:''}${mk.indexOf('nm')>=0?`<div class="row" data-a="moon">${moonIcon(0,22)}<div class="n">New Moon</div></div>`:''}${ec?`<div class="row" data-a="moon">${ic('eclipse',20)}<div class="n">${ec[1]}</div></div>`:''}
 <div class="kv"><b>Moon</b><div>${m.name}, ${m.illum}% lit, in ${m.sign}</div><b>Sun</b><div>In ${m.sun}</div>${st?`<b>Sunrise</b><div>${st.rise?tm(st.rise):st.polar==='day'?'sun stays up':'sun stays down'}</div><b>Sunset</b><div>${st.set?tm(st.set):'—'}</div><b>Day length</b><div>${lenTxt(st.len)}</div>`:''}<b>Card</b><div>${esc(c.name)} (${c.rev?'reversed':'upright'}): ${esc(c.mean)}</div></div>`)}
function sheetCard(){const c=tarotToday(new Date());openSheet(`<h2>${esc(c.name)}</h2><p class="sub">${c.rev?'Reversed':'Upright'}</p><div style="width:9em;margin:.6em auto">${cardSVG(c)}</div><p style="text-align:center;font-size:1.15em">${esc(c.mean)}</p><h3>Both meanings</h3><div class="kv"><b>Upright</b><div>${esc(c.up)}</div><b>Reversed</b><div>${esc(c.rv)}</div></div><p class="hint">One card for each date, the same for everyone. Treat it as a prompt for reflection.</p>`)}
let GEO=[];
function sheetSet(msg){const sel=(k,v,o)=>`<select data-s="${k}">${o.map(x=>`<option value="${x[0]}"${String(S[k])===String(x[0])?' selected':''}>${x[1]}</option>`).join('')}</select>`;
 openSheet(`<div class="set"><h2>Settings</h2><p class="sub">Saved only on this device.</p>
 <label>Your first name (optional)</label><input type="text" data-s="name" value="${esc(S.name)}" placeholder="Shows in the greeting">
 <label>Your place</label><div class="r"><input type="search" id="q" placeholder="City or town" value=""><button class="btn" data-a="find">Find</button><button class="btn g" data-a="geo">Use my location</button></div>
 <div id="geo">${GEO.map((g,i)=>`<div class="row" data-a="pick:${i}"><div class="n">${esc(g.name)}<small>${esc([g.admin1,g.country].filter(Boolean).join(', '))}</small></div></div>`).join('')}</div>
 <p class="hint">${hasLoc()?'Now: '+esc(S.place||S.lat.toFixed(2)+', '+S.lon.toFixed(2))+'.':'Not set.'} ${msg||''} Used for sunrise, sunset, day length, hemisphere and weather. Only coordinates are sent, to Open-Meteo, for weather.</p>
 <label>Hemisphere</label>${sel('hemi',0,[['auto','Automatic (from your place)'],['n','Northern'],['s','Southern']])}
 <label>Show first</label>${sel('units',0,[['F','Fahrenheit, then Celsius'],['C','Celsius, then Fahrenheit']])}
 <label>Clock</label>${sel('h24',0,[['false','12-hour'],['true','24-hour']])}
 <label>Cross-quarter festivals (Samhain, Imbolc, Beltane, Lughnasadh)</label>${sel('cross',0,[['trad','Traditional calendar dates'],['astro','Astronomical midpoints']])}
 <label>Moon screen starts after (when not alternating)</label>${sel('saver',0,[['0','Never (button only)'],['1','1 minute idle'],['5','5 minutes idle'],['10','10 minutes idle'],['30','30 minutes idle']])}
 <h3 style="margin-top:1.4em">Sun and moon screens</h3><p class="hint">The sun screen is the four tiles. The moon screen is the moon inside the Wheel, with sky and festival details.</p>
 <div class="ck"><input type="checkbox" id="cycle"${S.cycle?' checked':''}><label for="cycle" style="margin:0">Alternate between the sun screen and the moon screen</label></div>
 <label>Sun screen stays for <b id="sunL">${secTxt(S.sunSec)}</b></label><input type="range" min="15" max="600" step="15" value="${S.sunSec}" data-s="sunSec" data-lbl="sunL">
 <label>Moon screen stays for <b id="moonL">${secTxt(S.moonSec)}</b></label><input type="range" min="15" max="600" step="15" value="${S.moonSec}" data-s="moonSec" data-lbl="moonL">
 <label>Look</label>${sel('theme',0,[['auto','Automatic (lighter by day)'],['dark','Always deep purple'],['light','Always lighter']])}
 <div class="ck"><input type="checkbox" id="tarot"${S.tarot?' checked':''}><label for="tarot" style="margin:0">Show the card of the day</label></div>
 <div class="r" style="margin-top:1em"><button class="btn" data-a="link">Copy a link with these settings</button><button class="btn g" data-a="reset">Reset</button></div>
 <div class="r" style="margin-top:.6em;flex-wrap:wrap"><button class="btn g" data-a="link:cycle">Sun &amp; moon display link</button><button class="btn g" data-a="link:sun">Sun-only link</button><button class="btn g" data-a="link:moon">Moon-only link</button></div><p class="hint">Sun &amp; moon: the four tiles and the moon screen take turns, for the times above. Sun-only: just the four tiles. Moon-only: the moon screen always on. These links fill the screen with no buttons.</p><p class="hint" id="lk"></p></div>`)}
function afterSet(){saveS();evCache_clear();loadWx();render();restartIdle()}
function evCache_clear(){for(const k in evCache)delete evCache[k]}

/* ---------- theme ---------- */
function applyTheme(){const n=new Date(),f=S.theme;let day=false;
 if(f==='light')day=true;else if(f==='dark')day=false;else{const st=hasLoc()?sunTimes(n,S.lat,S.lon):null;day=st&&st.rise?(n>=st.rise&&n<st.set):(n.getHours()>=7&&n.getHours()<19)}
 document.documentElement.classList.toggle('daylight',day)}

/* ---------- moon screen ---------- */
let phaseT=Date.now();const SV={on:false};let lastActive=Date.now(),idleT=null;
function mkStars(el){if(el.children.length)return;for(let i=0;i<70;i++){const s=document.createElement('i'),z=1+Math.random()*2.4;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--d:${3+Math.random()*5}s;--l:-${Math.random()*8}s`;el.appendChild(s)}}
const secTxt=s=>s<60?s+' sec':Math.floor(s/60)+' min'+(s%60?' '+(s%60)+' sec':'');
function panels(now){const m=moonAt(now),w=wheelInfo(now),e=w.today||w.next,d=W8[e.idx],ev=moonEvents(now,new Date(now.getTime()+45*DAY)),nf=ev.find(x=>x.type===2),nn=ev.find(x=>x.type===0),ec=ECL.find(x=>x[0]>=ymd(now)),st=hasLoc()?sunTimes(now,S.lat,S.lon):null,fnm=nf&&fullName(nf.t),day=Math.floor(now.getTime()/864e5),rit=[0,1,2].map(i=>d.ways[(day+i)%d.ways.length]);
 const ecd=ec&&new Date(ec[0]+'T12:00:00');
 const L=`<h5 style="margin-top:0">Moon and sky</h5><h4>Tonight</h4><p>${PHASE_TXT[m.idx]}</p><h5>Moon</h5><p>${m.illum}% lit · in ${m.sign}</p>${nf?`<h5>Next full moon</h5><p><b>${fnm?fnm+' Moon':'Full Moon'}</b><br>${wdl(nf.t)}</p>${fnm?`<p class="sub2">${FM_MEAN[fnm]}</p>`:''}`:''}${nn?`<h5>Next new moon</h5><p>${wdl(nn.t)}</p>`:''}${ec?`<h5>Next eclipse</h5><p>${ec[1]}<br>${mdl(ecd)}</p>`:''}<h5>Sun</h5><p>In ${m.sun}${st&&st.rise?'<br>'+tm(st.rise)+' to '+tm(st.set):''}</p>`;
 const R=`<h5 style="margin-top:0">Wheel of the Year</h5><h4>${WN[e.idx]}</h4><p class="sub2">${w.today?'Today':cdTxt(w.days)} · ${d.season}</p><p>${esc(d.theme)}</p><h5>Rituals</h5><ul>${rit.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h5>Colors</h5><div>${chipsOf(d.colors,'var(--acc)')}</div><h5>Plants</h5><div>${chipsOf(d.plants,'var(--gold)')}</div><h5>Stones</h5><div>${chipsOf(d.stones,'var(--acc)')}</div><div class="x1"><h5>Foods</h5><div>${chipsOf(d.foods,'var(--gold)')}</div></div>`;
 return [L,R]}
function saverBar(){const now=new Date(),m=moonAt(now),h=now.getHours(),night=S.dim!==false&&(h>=22||h<6),w=wheelInfo(now);
 $('#saver').classList.toggle('night',night);document.body.classList.toggle('night',night&&SV.on);
 const pn=panels(now);if(SV.pl!==pn[0]){SV.pl=pn[0];$('#saver .pl').innerHTML=pn[0]}if(SV.pr!==pn[1]){SV.pr=pn[1];$('#saver .pr').innerHTML=pn[1]}
 const html=moonSVG(m.f)+wheelSVG(w,true,now);if(SV.m!==html){SV.m=html;$('#saver .moon').innerHTML=html}
 $('#saver .mname').innerHTML=m.name+'<small>'+m.illum+'% lit · in '+m.sign+'</small>';$('#saver .sclk').innerHTML=clockHTML(now);
 const nf=moonEvents(now,new Date(now.getTime()+40*DAY)).find(e=>e.type===2),nn=nf&&fullName(nf.t),e=w.today||w.next;
 $('#saver .sbar').innerHTML=`<div>${WX?wxTxt():''}</div><div><b>Next full moon</b><span class="g">${nf?(nn?nn+' Moon · ':'')+mdl(nf.t):''}</span></div><div><span class="g">${w.today?WN[e.idx]+' today':WN[e.idx]+' '+cdTxt(w.days)}</span></div>`}
function startSaver(){SV.on=true;phaseT=Date.now();mkStars($('#saver .stars'));saverBar();document.body.classList.add('sv');$('#saver').classList.add('on')}
function wake(){lastActive=Date.now();phaseT=Date.now();if(MODE==='wallpaper'||!SV.on)return;SV.on=false;$('#saver').classList.remove('on');document.body.classList.remove('sv','night')}
function restartIdle(){clearInterval(idleT);if(MODE==='wallpaper'){idleT=setInterval(()=>{if(!SV.on)startSaver();else saverBar()},5000);return}if(S.cycle){phaseT=Date.now();idleT=setInterval(()=>{const sh=$('#sheet').classList.contains('on');if(SV.on){saverBar();if(Date.now()-phaseT>=S.moonSec*1000)wake()}else if(sh)phaseT=Date.now();else if(Date.now()-phaseT>=S.sunSec*1000)startSaver()},1000);return}const ms=(parseFloat(S.saver)||0)*60000;if(!ms)return;idleT=setInterval(()=>{if(SV.on)saverBar();else if(Date.now()-lastActive>ms&&!$('#sheet').classList.contains('on'))startSaver()},5000)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
 if(k==='close')closeSheet();else if(k==='wheel')sheetWheel();else if(k==='sab')sheetSab(+v);else if(k==='moon')sheetMoon();else if(k==='day')sheetDay(v);else if(k==='card')sheetCard();
 else if(k==='fs')toggleFs();else if(k==='set')sheetSet();else if(k==='saver'){closeSheet();startSaver()}else if(k==='mprev'){mOff--;render()}else if(k==='mnext'){mOff++;render()}else if(k==='mnow'){mOff=0;render()}
 else if(k==='find'){const q=$('#q').value.trim();if(!q)return;fetch('https:\/\/geocoding-api.open-meteo.com\/v1\/search?count=6&name='+encodeURIComponent(q)).then(r=>r.json()).then(j=>{GEO=j.results||[];sheetSet(GEO.length?'Pick one below.':'No match. Try the city name alone.')}).catch(()=>sheetSet('Could not search right now.'))}
 else if(k==='pick'){const g=GEO[+v];if(g){S.lat=g.latitude;S.lon=g.longitude;S.place=g.name+(g.admin1?', '+g.admin1:'');GEO=[];afterSet();sheetSet('Saved.')}}
 else if(k==='geo'){if(!navigator.geolocation){sheetSet('This browser cannot share location. Search for your city instead.');return}navigator.geolocation.getCurrentPosition(p=>{S.lat=Math.round(p.coords.latitude*100)/100;S.lon=Math.round(p.coords.longitude*100)/100;S.place='My location';afterSet();sheetSet('Saved.')},()=>sheetSet('Location was not shared. Search for your city instead.'),{timeout:10000})}
 else if(k==='reset'){S=Object.assign({},DEF);try{localStorage.removeItem('wm_s');localStorage.removeItem('wm_wx')}catch(x){};WX=null;afterSet();sheetSet('Reset.')}
 else if(k==='link'){const q=new URLSearchParams();if(S.name)q.set('name',S.name);if(hasLoc()){q.set('lat',S.lat);q.set('lon',S.lon);if(S.place)q.set('place',S.place)}q.set('hemi',S.hemi);q.set('units',S.units);q.set('h24',S.h24?1:0);q.set('tarot',S.tarot?1:0);q.set('cross',S.cross);q.set('saver',S.saver);if(!S.dim)q.set('dim',0);if(v==='cycle'){q.set('mode','display');q.set('cycle',1);q.set('sun',S.sunSec);q.set('moon',S.moonSec)}else if(v==='sun'){q.set('mode','display');q.set('cycle',0)}else if(v==='moon'){q.set('mode','moon')}else if(S.cycle){q.set('cycle',1);q.set('sun',S.sunSec);q.set('moon',S.moonSec)}
  const u=location.href.split('?')[0].split('#')[0]+'?'+q.toString();try{navigator.clipboard.writeText(u).then(()=>{$('#lk').textContent='Link copied.'},()=>{$('#lk').textContent=u})}catch(x){$('#lk').textContent=u}}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='tarot'){S.tarot=t.checked;afterSet();return}if(t.id==='cycle'){S.cycle=t.checked;afterSet();return}const k=t.dataset&&t.dataset.s;if(!k)return;
 S[k]=k==='h24'?t.value==='true':(k==='saver'||k==='sunSec'||k==='moonSec')?parseFloat(t.value):t.value;afterSet()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.lbl){const l=$('#'+t.dataset.lbl);if(l)l.textContent=secTxt(+t.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(SV.on)wake();else closeSheet()}});
['pointerdown','touchstart','keydown'].forEach(t=>addEventListener(t,wake,{passive:true}));
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
let WL=null;async function keepAwake(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
addEventListener('pointerdown',()=>{if(SV.on)keepAwake()},{passive:true});
function tick(){const h=clockHTML(new Date());document.querySelectorAll('.bigclk').forEach(e=>{if(e.innerHTML!==h)e.innerHTML=h})}
loadS();loadWx();render();restartIdle();mkStars($('#saver .stars'));if(MODE==='wallpaper')startSaver();
setInterval(loadWx,20*60000);
if(MODE==='wallpaper'){let first=true;document.addEventListener('click',()=>{if(first){first=false;toggleFs()}});document.addEventListener('dblclick',()=>{const q=new URLSearchParams(location.search);q.delete('mode');location.search=q.toString()})}
setInterval(tick,5000);setInterval(()=>{if(!$('#sheet').classList.contains('on'))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadWx();render()}});
let seen=false;try{seen=!!localStorage.getItem('wm_seen')}catch(e){}
if(!hasLoc()&&!MODE&&!seen){try{localStorage.setItem('wm_seen','1')}catch(e){}setTimeout(()=>sheetSet('Welcome! Set your place to see sunrise and weather.'),600)}
</script></body></html>
